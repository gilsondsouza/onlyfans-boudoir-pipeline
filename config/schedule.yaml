# =============================================================================
# OnlyFans Boudoir Pipeline — Regras de Agendamento
# =============================================================================

scheduler:
  # Verificar novos conteúdos a cada N minutos
  check_interval_minutes: 15

  # Número máximo de uploads simultâneos
  max_concurrent_uploads: 3

  # Regras globais aplicadas a todos os modelos
  global_rules:
    # Não publicar nos mesmos horários para modelos diferentes
    avoid_time_collision_minutes: 30

    # Intervalo mínimo entre posts do mesmo modelo (em horas)
    min_post_interval_hours: 4

    # Máximo de posts por modelo por dia
    max_posts_per_day: 5

  # Datas especiais com aumento de conteúdo
  special_dates:
    - name: "Dia dos Namorados"
      date: "06-12"                 # formato MM-DD (recorrente)
      boost_factor: 1.5             # 50% mais posts neste dia
    - name: "Valentine's Day"
      date: "02-14"
      boost_factor: 1.5
    - name: "Natal"
      date: "12-25"
      boost_factor: 1.3
    - name: "Ano Novo"
      date: "01-01"
      boost_factor: 1.4
    - name: "Dia da Mulher"
      date: "03-08"
      boost_factor: 1.6

  # Janelas de publicação por dia da semana
  # 0=Segunda, 1=Terça, ..., 6=Domingo
  weekly_pattern:
    0: { intensity: medium }        # Segunda
    1: { intensity: medium }        # Terça
    2: { intensity: high }          # Quarta
    3: { intensity: medium }        # Quinta
    4: { intensity: high }          # Sexta
    5: { intensity: peak }          # Sábado (maior engajamento)
    6: { intensity: high }          # Domingo

  intensity_levels:
    low:    { posts_multiplier: 0.5 }
    medium: { posts_multiplier: 1.0 }
    high:   { posts_multiplier: 1.3 }
    peak:   { posts_multiplier: 1.5 }

  # Fila de reprocessamento em caso de falha de upload
  retry:
    max_attempts: 3
    backoff_seconds: [60, 300, 900]   # 1min, 5min, 15min
