[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onlyfans-boudoir-pipeline"
version = "0.1.0"
description = "Pipeline autônomo de produção de conteúdo boudoir artístico para OnlyFans - 7 modelos + agente interativo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
